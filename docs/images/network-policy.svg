<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="外向き通信の許可がどこで決まるかの図">
  <style>
    .bg    { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .box   { fill: #ffffff; stroke: #d0d7de; }
    .t     { fill: #1f2328; font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 13px; }
    .b     { fill: #1f2328; font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 13px; font-weight: 600; }
    .m     { fill: #1f2328; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
    .dim   { fill: #656d76; font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 11.5px; }
    .hd    { fill: #656d76; font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 12px; font-weight: 600; }
    .arrow { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .box   { fill: #0d1117; stroke: #30363d; }
      .t, .b, .m { fill: #e6edf3; }
      .dim, .hd { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="np" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="420"/>

  <text class="hd" x="24" y="34">サンドボックスの足で出る</text>
  <text class="hd" x="474" y="34">ホストの足で出る</text>

  <rect class="panel" x="24" y="48" width="410" height="228" rx="8"/>
  <text class="dim" x="46" y="74">許可はこの 2 つの和。どちらかにあれば通る。</text>

  <rect class="box" x="46" y="88" width="366" height="76" rx="6"/>
  <text class="b" x="66" y="112">マシン全体の設定（sbx policy）</text>
  <text class="t" x="66" y="134">mise run setup が balanced で初期化する。AI サービスや</text>
  <text class="t" x="66" y="152">パッケージレジストリなど約 190 件が許可された状態</text>

  <rect class="box" x="46" y="176" width="366" height="76" rx="6"/>
  <text class="b" x="66" y="200">kits/network-policy/spec.yaml</text>
  <text class="t" x="66" y="222">チームで足す分。PR レビューを通って全員に配られる</text>
  <text class="t" x="66" y="240">ここから許可を狭めることはできない</text>

  <rect class="panel" x="474" y="48" width="382" height="228" rx="8"/>
  <text class="dim" x="496" y="74">上のポリシーは一切かからない。</text>

  <rect class="box" x="496" y="88" width="338" height="164" rx="6"/>
  <text class="b" x="516" y="112">host-bridge が中継する宛先</text>
  <text class="m" x="516" y="136">share/host-mcp.json</text>
  <text class="m" x="516" y="156">local/host-mcp.json</text>
  <text class="t" x="516" y="184">の `url:` に書いた相手へは、ホストが自分の足で</text>
  <text class="t" x="516" y="202">繋ぎに行き、結果だけをサンドボックスへ返す。</text>
  <text class="t" x="516" y="230">何を載せるかがそのまま境界の設定になる。</text>

  <path class="arrow" d="M229,276 L229,306" marker-end="url(#np)"/>
  <path class="arrow" d="M665,276 L665,306" marker-end="url(#np)"/>
  <text class="m" x="150" y="326">github.com / npm / …</text>
  <text class="m" x="560" y="326">Figma・Atlassian・Xcode …</text>

  <text class="dim" x="24" y="372">実際に効いているものを見る： sbx policy ls ／ sbx policy check &lt;宛先&gt;</text>
  <text class="dim" x="24" y="394">ここに書いた宛先だけに絞りたいなら sbx policy init deny-all。ただし他の sbx サンドボックスにも効く。</text>
</svg>
