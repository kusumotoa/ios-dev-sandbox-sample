<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="gh が対象リポジトリに応じて 2 本の PAT を使い分ける図">
  <style>
    .bg    { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .box   { fill: #ffffff; stroke: #d0d7de; }
    .t     { fill: #1f2328; font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 13px; }
    .b     { fill: #1f2328; font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 13px; font-weight: 600; }
    .m     { fill: #1f2328; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
    .dim   { fill: #656d76; font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 11.5px; }
    .hd    { fill: #656d76; font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 12px; font-weight: 600; }
    .arrow { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .box   { fill: #0d1117; stroke: #30363d; }
      .t, .b, .m { fill: #e6edf3; }
      .dim, .hd { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="420"/>

  <rect class="box" x="350" y="24" width="180" height="44" rx="6"/>
  <text class="m" x="372" y="52">git push / gh</text>

  <path class="arrow" d="M440,68 L440,96" marker-end="url(#p)"/>

  <rect class="panel" x="300" y="96" width="280" height="58" rx="8"/>
  <text class="b" x="322" y="120">gh ラッパー</text>
  <text class="dim" x="322" y="142">対象は書き込みリストにあるか</text>

  <path class="arrow" d="M370,154 C300,182 210,196 190,224" marker-end="url(#p)"/>
  <path class="arrow" d="M510,154 C580,182 670,196 690,224" marker-end="url(#p)"/>
  <text class="dim" x="252" y="190">ある</text>
  <text class="dim" x="600" y="190">ない</text>

  <rect class="box" x="40" y="224" width="300" height="96" rx="6"/>
  <text class="b" x="62" y="250">書き込み用 PAT</text>
  <text class="t" x="62" y="274">チーム管轄のリポジトリだけ</text>
  <text class="t" x="62" y="296">Contents / PR / Issues: 読み書き</text>

  <rect class="box" x="540" y="224" width="300" height="96" rx="6"/>
  <text class="b" x="562" y="250">読み取り専用 PAT</text>
  <text class="t" x="562" y="274">org 内すべてで構わない</text>
  <text class="t" x="562" y="296">Contents / PR / Issues: 読むだけ</text>

  <text class="dim" x="40" y="356">1 本の PAT では権限が「選んだリポジトリ全体に一律」になるので、「A は書ける、B は読むだけ」を作れない。</text>
  <text class="dim" x="40" y="378">書き込みリストは作成時に書き込み用 PAT のスコープから引くので、手で書かなくてよい。</text>
  <text class="dim" x="40" y="400">選択を誤っても危険はない。実際の境界は PAT のスコープ側にあり、スコープ外なら 404 になるだけ。</text>
</svg>
