<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-label="ios-dev-sandbox の構成図">
  <style>
    .bg    { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .box   { fill: #ffffff; stroke: #d0d7de; }
    .t     { fill: #1f2328; font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 13px; }
    .m     { fill: #1f2328; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
    .dim   { fill: #656d76; font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 11.5px; }
    .hd    { fill: #656d76; font-family: -apple-system, "Hiragino Sans", sans-serif; font-size: 12px; font-weight: 600; }
    .arrow { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .box   { fill: #0d1117; stroke: #30363d; }
      .t, .m { fill: #e6edf3; }
      .dim, .hd { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect class="bg" width="880" height="500"/>

  <text class="hd" x="24"  y="26">サンドボックス（Linux microVM。agent ごとに 1 つ）</text>
  <text class="hd" x="524" y="26">ホスト（macOS）</text>
  <rect class="panel" x="16"  y="38" width="296" height="446" rx="8"/>
  <rect class="panel" x="516" y="38" width="348" height="446" rx="8"/>

  <rect class="box" x="36" y="62" width="256" height="52" rx="6"/>
  <text class="t" x="52" y="84">エージェント</text>
  <text class="dim" x="52" y="103">Claude Code / Codex / Copilot CLI のどれか</text>

  <rect class="box" x="36" y="130" width="256" height="56" rx="6"/>
  <text class="t" x="52" y="153">MCP クライアント</text>
  <text class="dim" x="52" y="173">.claude.json / config.toml / mcp-config.json（kit が登録）</text>

  <rect class="box" x="36" y="204" width="256" height="40" rx="6"/>
  <text class="t" x="52" y="229">ホスト CLI の中継コマンド</text>

  <rect class="box" x="536" y="96" width="308" height="152" rx="6"/>
  <text class="m" x="552" y="120">host-bridge（127.0.0.1:19721）</text>
  <text class="dim" x="552" y="140">allowlist と host-mcp.json は</text>
  <text class="dim" x="552" y="156">share/（チーム）+ local/（マシン固有）の 2 層</text>
  <text class="m" x="552" y="180">/mcp/xcode → mcpbridge → Xcode</text>
  <text class="m" x="552" y="200">/mcp/&lt;名前&gt; → Figma・npx など</text>
  <text class="m" x="552" y="224">/exec → macOS 専用 CLI を実行</text>

  <path class="arrow" d="M292,158 L532,160" marker-end="url(#a)"/>
  <path class="arrow" d="M292,224 L532,220" marker-end="url(#a)"/>
  <text class="dim" x="380" y="150">HTTP</text>

  <rect class="box" x="36" y="272" width="256" height="52" rx="6"/>
  <text class="t" x="52" y="294">スキル</text>
  <text class="dim" x="52" y="313">agent の skills ディレクトリに symlink</text>

  <rect class="box" x="536" y="278" width="308" height="46" rx="6"/>
  <text class="m" x="552" y="300">share/skills + local/skills</text>
  <text class="dim" x="552" y="316">読み取り専用マウント。ホストの ~/.claude は持ち込まない</text>

  <path class="arrow" d="M292,298 L532,301" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <rect class="box" x="36" y="344" width="256" height="52" rx="6"/>
  <text class="t" x="52" y="366">会話履歴</text>
  <text class="dim" x="52" y="385">apply で作り直しても残る</text>

  <rect class="box" x="536" y="350" width="308" height="46" rx="6"/>
  <text class="m" x="552" y="372">~/.config/ios-dev-sandbox/projects/&lt;名前&gt;/</text>
  <text class="m" x="552" y="390">  &lt;agent&gt;/state</text>

  <path class="arrow" d="M292,370 L532,373" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <rect class="box" x="36" y="416" width="256" height="52" rx="6"/>
  <text class="t" x="52" y="438">成果物（$IOS_DEV_SANDBOX_ARTIFACTS）</text>
  <text class="dim" x="52" y="457">スクリーンショットなど。リポジトリを汚さない</text>

  <rect class="box" x="536" y="422" width="308" height="46" rx="6"/>
  <text class="m" x="552" y="444">…/projects/&lt;名前&gt;/artifacts</text>
  <text class="dim" x="552" y="460">全 agent 共通。読み書き可。ホストと同じ絶対パス</text>

  <path class="arrow" d="M292,442 L532,445" stroke-dasharray="4 3" marker-end="url(#a)"/>
</svg>
